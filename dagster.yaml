# Dagster instance configuration — SQLite storage (local-first, zero deps).
# Override with DAGSTER_HOME env var to change storage location.

# Concurrency control for DuckDB single-writer constraint
concurrency:
  default_op_concurrency_limit: 4
  runs:
    tag_concurrency_limits:
      - key: "dagster/concurrency_key"
        value: "duckdb_writer"
        limit: 1
