version: 2

models:
  - name: metricflow_time_spine
    description: >
      Required MetricFlow time spine table containing one row per calendar date
      from 2022 through 2026. MetricFlow uses this table as the backbone for all
      time-series metric calculations and date-spine joins.
    columns:
      - name: date_day
        description: Calendar date (primary key for MetricFlow time spine).
        tests:
          - not_null
          - unique

  - name: sem_bus_segment_speeds
    description: >
      MetricFlow semantic model exposing bus segment speed metrics.
      Provides the foundation for defining measures (avg speed, trip count,
      distance, travel time) and dimensions (route, segment, time of day)
      accessible via MetricFlow metric queries.
      NOTE: min_speed_mph, max_speed_mph, median_speed_mph, and speed_variability_mph
      are not available in the source data and are absent from this model.
    columns:
      - name: segment_speed_key
        description: Surrogate key for the segment speed record.
        tests:
          - not_null
          - unique
      - name: route_id
        description: MTA bus route identifier (entity).
        tests:
          - not_null
      - name: segment_id
        description: Segment identifier (entity).
        tests:
          - not_null
      - name: metric_date
        description: Representative calendar date for MetricFlow time aggregation.
        tests:
          - not_null
      - name: hour_of_day
        description: Hour of day (0-23).
        tests:
          - not_null
      - name: avg_speed_mph
        description: Average speed in mph (measure).
        tests:
          - not_null
      - name: trip_count
        description: Number of trips contributing to the measurement (measure).
      - name: road_distance_miles
        description: Road distance of the segment in miles (measure).
      - name: avg_travel_time_min
        description: Average travel time for the segment in minutes (measure).
      - name: segment_start
        description: Start location of the segment (dimension).
      - name: segment_end
        description: End location of the segment (dimension).

semantic_models:
  - name: sem_bus_segment_speeds
    description: Semantic model for MetricFlow bus segment speed metrics.
    model: ref('sem_bus_segment_speeds')
    defaults:
      agg_time_dimension: metric_date
    entities:
      - name: segment_speed
        type: primary
        expr: segment_speed_key
      - name: route
        type: foreign
        expr: route_id
      - name: segment
        type: foreign
        expr: segment_id
    dimensions:
      - name: metric_date
        type: time
        type_params:
          time_granularity: day
      - name: hour_of_day
        type: categorical
      - name: segment_start
        type: categorical
      - name: segment_end
        type: categorical
    measures:
      - name: avg_bus_speed_mph
        description: Average bus speed in mph.
        agg: average
        expr: avg_speed_mph
      - name: total_trip_count
        description: Total number of bus trips.
        agg: sum
        expr: trip_count
      - name: total_road_distance_miles
        description: Total road distance covered in miles.
        agg: sum
        expr: road_distance_miles
      - name: avg_travel_time_min
        description: Average segment travel time in minutes.
        agg: average
        expr: avg_travel_time_min

metrics:
  - name: avg_bus_speed
    label: Average Bus Speed
    description: Network-wide average bus speed in mph.
    type: simple
    type_params:
      measure: avg_bus_speed_mph

  - name: total_bus_trips
    label: Total Bus Trips
    description: Total number of bus trips across the network.
    type: simple
    type_params:
      measure: total_trip_count

  - name: avg_segment_travel_time
    label: Average Segment Travel Time
    description: Average travel time per segment in minutes.
    type: simple
    type_params:
      measure: avg_travel_time_min
