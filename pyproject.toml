[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "database-tycoon"
version = "0.5.0"
description = "Database Tycoon — local-first analytics CLI for exploring any dataset"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Database Tycoon Team"}]
requires-python = ">=3.12"
keywords = ["data", "analytics", "duckdb", "dbt", "dlt", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "dbt-core>=1.9.0",
    "dbt-duckdb>=1.9.0",
    "dlt[duckdb]>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "duckdb>=1.2.0",
    "httpx>=0.27.0",
    "websockets>=14.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dagster = [
    "dagster>=1.9.0",
    "dagster-webserver>=1.9.0",
    "dagster-dbt>=0.25.0",
    "dagster-dlt>=0.25.0",
]
ask = [
    "nao-core>=0.0.59",
    "ibis-framework[duckdb]>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/database-tycoon/localhost-stack"
Repository = "https://github.com/database-tycoon/localhost-stack"
Issues = "https://github.com/database-tycoon/localhost-stack/issues"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[project.scripts]
tycoon = "tycoon.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tycoon"]

[tool.uv]
prerelease = "if-necessary-or-explicit"
